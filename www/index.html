<title>مخطط أيامي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap">
<style>
/* Layout: splash, then onboarding (first run), then a shell with top bar, one page at a time, and a bottom tab bar. Pages: today, calendar, goals, stats, settings. */
:root{
  --bg:#EBF0F0; --surface:#FFFFFF; --surface2:#F2F6F6; --ink:#10201F; --ink2:#566866; --line:#D8E1E0;
  --accent:#0E7A6E; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --gold:#B07A14; --gold-soft:#F7E9CC;
  --ok:#1E8F5A; --ok-soft:#DCF2E7; --danger:#C0392B; --danger-soft:#F9E1DE;
  --p1:#4F86E8; --p2:#D8962A; --p3:#D4483F;
  --hero-a:#0E7A6E; --hero-b:#0A4A5A; --hero-ink:#FFFFFF; --ring-t:rgba(255,255,255,.22); --ring-f:#FFFFFF;
  --shadow:0 1px 2px rgba(16,32,31,.06),0 10px 24px -14px rgba(16,32,31,.22);
  --font-display:'Reem Kufi','Segoe UI',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-mode="light"]){
    --bg:#0A1315; --surface:#111C1E; --surface2:#172629; --ink:#E6F0EE; --ink2:#93A8A5; --line:#22363A;
    --accent:#45D0B7; --accent-ink:#06201C; --accent-soft:#123B37;
    --gold:#E3B050; --gold-soft:#3A2E12;
    --ok:#4CC28A; --ok-soft:#14352A; --danger:#FF8B7E; --danger-soft:#3C1B18;
    --p1:#7FA8F5; --p2:#EDB255; --p3:#FF8478;
    --hero-a:#13645C; --hero-b:#0D3240; --ring-t:rgba(255,255,255,.18);
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"],:root[data-mode="dark"]{
  --bg:#0A1315; --surface:#111C1E; --surface2:#172629; --ink:#E6F0EE; --ink2:#93A8A5; --line:#22363A;
  --accent:#45D0B7; --accent-ink:#06201C; --accent-soft:#123B37;
  --gold:#E3B050; --gold-soft:#3A2E12;
  --ok:#4CC28A; --ok-soft:#14352A; --danger:#FF8B7E; --danger-soft:#3C1B18;
  --p1:#7FA8F5; --p2:#EDB255; --p3:#FF8478;
  --hero-a:#13645C; --hero-b:#0D3240; --ring-t:rgba(255,255,255,.18);
  --shadow:none; color-scheme:dark;
}
:root[data-mode="light"]{
  --bg:#EBF0F0; --surface:#FFFFFF; --surface2:#F2F6F6; --ink:#10201F; --ink2:#566866; --line:#D8E1E0;
  --accent:#0E7A6E; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --gold:#B07A14; --gold-soft:#F7E9CC;
  --ok:#1E8F5A; --ok-soft:#DCF2E7; --danger:#C0392B; --danger-soft:#F9E1DE;
  --p1:#4F86E8; --p2:#D8962A; --p3:#D4483F;
  --hero-a:#0E7A6E; --hero-b:#0A4A5A; --ring-t:rgba(255,255,255,.22);
  --shadow:0 1px 2px rgba(16,32,31,.06),0 10px 24px -14px rgba(16,32,31,.22); color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;
  padding-block:0 150px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;font-family:var(--font-display);font-weight:700;text-wrap:balance}
p{margin:0}
svg{display:block;flex:none}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h3{font-size:18px}
.sec-h small{color:var(--ink2);font-variant-numeric:tabular-nums}

/* splash */
#splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .5s ease,visibility .5s}
#splash.out{opacity:0;visibility:hidden}
.sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding:24px}
.sp-logo{width:112px;height:112px;filter:drop-shadow(0 14px 24px rgba(10,74,90,.35));animation:pop .7s cubic-bezier(.2,.9,.3,1.2) both}
.sp-logo .lg-arc{stroke-dashoffset:75;animation:arcdraw 1.1s .45s ease forwards}
.sp-logo .lg-tick{stroke-dasharray:100;stroke-dashoffset:100;animation:arcdraw .5s 1.2s ease forwards}
.sp-logo .lg-dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop2 .4s 1.5s cubic-bezier(.2,.9,.3,1.4) forwards}
.sp-name{font-family:var(--font-display);font-size:34px;font-weight:700;opacity:0;animation:rise .6s .5s ease forwards}
.sp-tag{color:var(--ink2);opacity:0;animation:rise .6s .75s ease forwards;max-width:300px}
.sp-bar{width:150px;height:4px;border-radius:99px;background:var(--line);overflow:hidden;opacity:0;animation:fadein .4s .9s ease forwards}
.sp-bar i{display:block;height:100%;width:40%;background:var(--accent);border-radius:99px;animation:slide 1.1s 1s ease-in-out infinite alternate}
@keyframes arcdraw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
@keyframes pop2{to{transform:scale(1)}}
@keyframes fadein{to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes slide{from{transform:translateX(-80%)}to{transform:translateX(260%)}}

/* onboarding */
#onb{position:fixed;inset:0;z-index:90;background:var(--bg);overflow:auto;padding:24px 16px;display:grid;place-items:center}
#onb[hidden]{display:none}
.ob{width:100%;max-width:440px;display:flex;flex-direction:column;gap:18px;animation:rise .5s ease both}
.ob-hero{display:flex;flex-direction:column;gap:6px}
.ob-hero h1{font-size:34px}
.ob-hero p{color:var(--ink2)}
.ob .card{display:flex;flex-direction:column;gap:14px;padding:20px}

/* shell */
.app[hidden],#bnav[hidden],#fab[hidden],#toast[hidden]{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:12px;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--font-display);font-size:22px;font-weight:700}
.brand .lg{width:34px;height:34px;display:block;flex:none}
.brand .lg svg{width:100%;height:100%}
.ob-hero svg{width:64px;height:64px;margin-bottom:8px;filter:drop-shadow(0 8px 14px rgba(10,74,90,.3))}
.tools{display:flex;align-items:center;gap:8px}
.ibtn{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);color:var(--ink2);font-weight:600;font-size:13px}
.ibtn:hover{color:var(--accent);border-color:var(--accent)}
.sdot{width:9px;height:9px;border-radius:50%;background:var(--ok)}
.sdot[data-state="saving"]{background:var(--accent)}
.sdot[data-state="local"]{background:var(--ink2)}
.sdot[data-state="error"]{background:var(--danger)}
#page{display:flex;flex-direction:column;gap:14px;min-width:0}
#page.enter{animation:rise .35s ease both}

/* bottom nav */
#bnav{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.bn{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px 8px}
.bn button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:14px;color:var(--ink2);font-size:11.5px;font-weight:500}
.bn button[aria-current="page"]{color:var(--accent);background:var(--accent-soft);font-weight:600}
.fab{position:fixed;inset-inline-end:max(16px,env(safe-area-inset-left,0px));bottom:calc(86px + env(safe-area-inset-bottom,0px));height:52px;padding-inline:20px 18px;border-radius:99px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.28);z-index:25}
#toast{position:fixed;inset-inline:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:420px;z-index:60;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;text-align:center;font-size:14px;animation:rise .25s ease both}

/* year band */
.yband{display:flex;flex-direction:column;gap:10px}
.yb-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.yb-l{color:var(--ink2);font-weight:500}
.yb-v{font-family:var(--font-display);font-size:28px;font-weight:700;color:var(--accent);display:inline-flex;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.cd-d{font-size:.62em;color:var(--ink2);font-family:var(--font-body);font-weight:500}
.cd-t{unicode-bidi:plaintext;font-variant-numeric:tabular-nums}
.ybar{position:relative;height:12px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.ybar>i{position:absolute;inset-block:0;inset-inline-start:0;width:var(--p,0%);background:var(--accent);border-radius:99px}
.ybar::after{content:"";position:absolute;inset:0;background-image:linear-gradient(to left,var(--surface) 2px,transparent 2px);background-size:calc(100%/12) 100%}
.ymonths{display:grid;grid-template-columns:repeat(12,1fr);text-align:center;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ymonths .cur{color:var(--accent);font-weight:600}

/* hero */
.hero{border-radius:24px;padding:18px;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));color:var(--hero-ink);display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.hr-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.hr-nav{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;color:var(--hero-ink)}
.hr-nav:hover{background:rgba(255,255,255,.24)}
.hr-mid{flex:1;text-align:center;min-width:0}
.hr-greet{font-size:14px;opacity:.9;overflow-wrap:anywhere}
.hr-today{font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);color:var(--hero-ink);margin-top:4px;display:inline-block}
.hr-main{display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1}
.hr-date{display:flex;align-items:center;gap:14px;min-width:0}
.hr-num{font-family:var(--font-display);font-weight:700;font-size:72px;line-height:1;font-variant-numeric:tabular-nums}
.hr-dn{display:flex;flex-direction:column;min-width:0}
.hr-dn strong{font-family:var(--font-display);font-size:22px;line-height:1.2}
.hr-dn span{font-size:13.5px;opacity:.85}
.ring{position:relative;width:92px;height:92px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9;stroke-linecap:round}
.ring .rt{stroke:var(--ring-t)}
.ring .rf{stroke:var(--ring-f);transition:stroke-dasharray .6s ease}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-display);font-size:20px;font-variant-numeric:tabular-nums}
.ring.sm{width:64px;height:64px}.ring.sm b{font-size:14px}.ring.sm circle{stroke-width:11}
.ring.on-surface .rt{stroke:var(--line)}.ring.on-surface .rf{stroke:var(--accent)}.ring.on-surface b{color:var(--ink)}
.hero .cd{position:relative;z-index:1;display:flex;flex-direction:column;gap:7px;padding-top:12px;border-top:1px solid rgba(255,255,255,.2)}
.hero .cd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.hero .cd-l{font-size:13px;color:var(--hero-ink);opacity:.85}
.hero .cd-v{font-family:var(--font-display);font-size:32px;font-weight:700;display:inline-flex;gap:8px;align-items:baseline;color:var(--hero-ink)}
.hero .cd-d{color:var(--hero-ink);opacity:.8}
.hero .bar{background:rgba(255,255,255,.2);border-color:transparent}
.hero .bar>i{background:var(--hero-ink)}
.hero .sum{position:relative;z-index:1;font-size:14px;opacity:.92}
.lockbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:var(--gold-soft);color:var(--gold);font-size:14px;font-weight:500}

/* countdown bars */
.cd{display:flex;flex-direction:column;gap:8px}
.cd-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cd-l{color:var(--ink2);font-size:13px}
.cd-v{font-family:var(--font-display);font-weight:700;font-size:22px;color:var(--ink);display:inline-flex;gap:8px;align-items:baseline}
.cd.mini .cd-v{font-size:13px;font-family:var(--font-body);font-weight:500;color:var(--ink2)}
.bar{height:6px;border-radius:99px;background:var(--surface2);overflow:hidden;display:block;border:1px solid var(--line)}
.bar>i{display:block;height:100%;width:var(--p,0%);background:var(--accent);border-radius:99px}

/* chips + tabs */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chipb{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink2);font-weight:500;font-size:14px}
.chipb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs{display:grid;gap:4px;padding:4px;border-radius:14px;background:var(--surface2);border:1px solid var(--line)}
.tab{padding:9px 6px;border-radius:10px;font-weight:500;color:var(--ink2)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:var(--shadow);font-weight:600}
.dnav{display:flex;align-items:center;gap:8px}
.dnav h2{flex:1;font-size:20px;text-align:center}
.ghost{padding:8px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--accent);font-weight:600}
.ghost:hover{border-color:var(--accent)}

/* lists */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:flex-start;gap:10px;padding:9px 10px;border-radius:14px;background:var(--surface2);border:1px solid transparent;border-inline-start:4px solid transparent}
.it:hover{border-color:var(--line)}
.it.pr1{border-inline-start-color:var(--p1)}.it.pr2{border-inline-start-color:var(--p2)}.it.pr3{border-inline-start-color:var(--p3)}
.chk{width:26px;height:26px;border-radius:9px;border:2px solid var(--ink2);display:grid;place-items:center;color:transparent;margin-top:1px;flex:none}
.chk:hover{border-color:var(--accent)}
.it.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.it.lock .chk{opacity:.55;cursor:not-allowed}
.it.lock.done .chk{opacity:.85}
.it-b{flex:1;min-width:0;text-align:start;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.it-t{overflow-wrap:anywhere}
.it.done .it-t{text-decoration:line-through;color:var(--ink2)}
.meta{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--ink2)}
.chip{padding:1px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:500;font-size:12px}
.chip.g{background:var(--surface);border:1px solid var(--line);color:var(--ink2)}
.chip.miss{background:var(--danger-soft);color:var(--danger)}
.chip.rg{background:var(--gold-soft);color:var(--gold)}
.empty{color:var(--ink2);font-size:14px;padding:6px 2px}
.qa{display:flex;gap:6px;margin-top:10px}
.qa input{flex:1;min-width:0;padding:10px 13px;border-radius:13px;border:1px solid var(--line);background:var(--surface)}
.qa input::placeholder{color:var(--ink2)}
.qa-b{width:42px;border-radius:13px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}

/* year grid */
.yg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.mm{padding:12px}
.mm-h{font-family:var(--font-display);font-weight:700;font-size:17px;margin-bottom:6px}
.mm-h:hover{color:var(--accent)}
.mm-w,.mm-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mm-w{font-size:11px;color:var(--ink2);margin-bottom:2px}
.yd{position:relative;aspect-ratio:1;border-radius:8px;font-size:12.5px;font-variant-numeric:tabular-nums}
.yd:hover{background:var(--accent-soft)}
.yd.past{color:var(--ink2)}
.yd.today{background:var(--accent);color:var(--accent-ink);font-weight:600}
.yd[data-n]::after{content:"";position:absolute;bottom:2px;inset-inline:0;margin-inline:auto;width:5px;height:5px;border-radius:50%;background:var(--accent);opacity:.45}
.yd[data-n="2"]::after{opacity:.75}.yd[data-n="3"]::after{opacity:1}
.yd.today[data-n]::after{background:var(--accent-ink)}

/* month */
.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mg-w{text-align:center;color:var(--ink2);font-size:13px;font-weight:500;padding-bottom:2px}
.mc{display:flex;flex-direction:column;gap:3px;align-items:stretch;text-align:start;min-height:92px;padding:7px;border-radius:13px;background:var(--surface);border:1px solid var(--line);min-width:0}
.mc:hover{border-color:var(--accent)}
.mc.past{background:var(--surface2)}
.mc.today{border-color:var(--accent);background:var(--accent-soft)}
.mc-top{display:flex;justify-content:space-between;align-items:center}
.mc-n{font-family:var(--font-display);font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.mc-c{font-size:11px;min-width:20px;height:20px;border-radius:99px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);padding:0 5px}
.mc-l{display:flex;flex-direction:column;gap:2px;min-width:0}
.mc-l em{font-style:normal;font-size:11.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-l em.d{text-decoration:line-through;opacity:.7}

/* week */
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.dc{display:flex;flex-direction:column;gap:8px;padding:12px}
.dc.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.dc.past{background:var(--surface2)}
.dc-h button{display:flex;align-items:baseline;gap:8px;text-align:start}
.dc-h b{font-family:var(--font-display);font-size:17px}
.dc-h span{color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.dc-h button:hover b{color:var(--accent)}

/* day grid */
.dgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"tasks tl";align-items:start}
.a-tasks{grid-area:tasks}.a-tl{grid-area:tl}
.tlw{overflow:hidden}
.tl{position:relative;margin-inline-start:50px;height:calc(var(--rows)*var(--hh));background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);border-top:1px solid var(--line)}
.tl.canadd{cursor:copy}
.hl{position:absolute;inset-inline-end:100%;margin-inline-end:8px;transform:translateY(-50%);font-size:11.5px;color:var(--ink2);white-space:nowrap}
.blk{position:absolute;inset-inline-start:calc(var(--c)/var(--n)*100% + 2px);width:calc(100%/var(--n) - 4px);border-radius:10px;padding:4px 8px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);text-align:start;overflow:hidden;display:flex;flex-direction:column;line-height:1.35;font-size:13px}
.blk b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk small{font-size:11px;opacity:.85}
.blk.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.blk.done b{text-decoration:line-through}
.nowline{position:absolute;inset-inline:-6px 0;height:2px;background:var(--danger);z-index:2;pointer-events:none}

var DB=null,base='',dirty=new Set(),flushing=false,ftimer=null,saveState='local';
function setSave(st){
  saveState=st;
  var d=$('#sdot');if(d){d.dataset.state=st;d.title=L({cloud:'sv_cloud',saving:'sv_saving',local:'sv_local',error:'sv_error'}[st])}
  var el=$('#save');if(el){el.dataset.state=st;el.textContent=L({cloud:'sv_cloud',saving:'sv_saving',local:'sv_local',error:'sv_error'}[st])}
}
function mark(){for(var i=0;i<arguments.length;i++)dirty.add(arguments[i]);saveLocal();schedule();notifSoon()}
function schedule(){if(!DB){setSave('local');return}setSave('saving');clearTimeout(ftimer);ftimer=setTimeout(flush,600)}
async function flush(){
  if(flushing){ftimer=setTimeout(flush,400);return}
  flushing=true;var cur=null;
  try{
    while(dirty.size){
      cur=Array.from(dirty)[0];dirty.delete(cur);
      var body=cur==='core'?S.core:S.years[cur.slice(1)];
      await DB.doc(base+'/'+cur).set(JSON.parse(JSON.stringify(body||{})));
      cur=null;
    }
    setSave('cloud');
  }catch(e){
    if(cur)dirty.add(cur);
    if(e&&e.code==='invalid_argument'){DB=null;dirty.clear();setSave('local')}
    else{setSave('error');clearTimeout(ftimer);ftimer=setTimeout(flush,5000)}
  }finally{flushing=false}
}
function hasLocalData(){if(S.core.profile||Object.keys(S.core.repeats).length)return true;for(var y in S.years){if(Object.keys(S.years[y].tasks).length)return true}return false}
async function pull(){
  var snap=await DB.collection(base).get();
  if(snap.empty){
    if(hasLocalData()){mark('core');for(var y in S.years)mark('y'+y)}else setSave('cloud');
    return;
  }
  var next={core:null,years:{}};
  snap.docs.forEach(function(d){var v=JSON.parse(JSON.stringify(d.data()||{}));if(d.id==='core')next.core=v;else if(/^y\d{4}$/.test(d.id))next.years[d.id.slice(1)]=v});
  S={core:next.core||{},years:next.years};normalize();saveLocal();setSave('cloud');applyTheme();applyLang();if(started)render();
}
async function initCloud(){

    var r=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!r[0]||!r[1])return;
    var id=await r[1].id();if(!id)return;
    DB=r[0];base='data/users/'+id;
    await pull();

}

/* ---------- repeating tasks ---------- */
function repMatch(r,dt){
  var k=dk(dt);if(k<r.st)return false;if(r.un&&k>r.un)return false;
  var s=pk(r.st);
  if(r.f==='d')return true;
  if(r.f==='w')return (r.dw&&r.dw.length?r.dw:[s.getDay()]).indexOf(dt.getDay())>=0;
  var last=dim(dt.getFullYear(),dt.getMonth());
  if(r.f==='m')return dt.getDate()===Math.min(s.getDate(),last);
  if(r.f==='y')return dt.getMonth()===s.getMonth()&&dt.getDate()===Math.min(s.getDate(),last);
  return false;
}

    if(isRange(t)){var b=pk(t.e),n=0;for(var d=pk(t.k);d<=b&&n<400;d=addDays(d,1),n++)(I.day[dk(d)]=I.day[dk(d)]||[]).push(t)}
    else (I[t.s][t.k]=I[t.s][t.k]||[]).push(t)}}
  IDX=I;
}

  var k=dk(dt),out=[],lock=k<dk(new Date());

    var rg=isRange(t);

      rng:rg?[t.k,t.e]:null,ref:'t:'+t.id+':'+k,k:k});
  });
  for(var rid in S.core.repeats){var r=S.core.repeats[rid];if(repMatch(r,dt)&&!isSkip(rid,k))
    out.push({id:rid,title:r.t,tm:r.tm||'',te:r.te||'',done:isDone(rid,k),rep:true,c:r.c||0,p:r.p||0,g:r.g||'',lock:lock,rng:null,ref:'r:'+rid+':'+k,k:k})}
  out.sort(function(a,b){return (a.tm&&b.tm)?a.tm.localeCompare(b.tm):a.tm?-1:b.tm?1:a.c-b.c});
  var od=S.core.ord&&S.core.ord[k];
  if(od&&od.length){out=out.map(function(x,i){var j=od.indexOf(x.id);return {x:x,j:j<0?1e6:j,i:i}}).sort(function(a,b){return a.j-b.j||a.i-b.i}).map(function(z){return z.x})}
  return out;
}

}

function timelineHTML(dt,items,lock){
  var timed=items.filter(function(i){return i.tm}),hs=S.core.settings.hs,he=S.core.settings.he,H=56;
  var ev=timed.map(function(i){var s=toMin(i.tm),e=i.te?Math.max(toMin(i.te),s+15):s+30;e=Math.min(e,1440);return {i:i,s:s,e:e,c:0,n:1}});
  ev.forEach(function(x){hs=Math.min(hs,Math.floor(x.s/60));he=Math.max(he,Math.ceil(x.e/60))});
  var rows=Math.max(1,he-hs);
  ev.sort(function(a,b){return a.s-b.s||a.e-b.e});
  var clusters=[],cl=[],cEnd=-1;
  ev.forEach(function(x){if(cl.length&&x.s>=cEnd){clusters.push(cl);cl=[];cEnd=-1}cl.push(x);cEnd=Math.max(cEnd,x.e)});
  if(cl.length)clusters.push(cl);
  clusters.forEach(function(c){var cols=[];c.forEach(function(x){var j=-1;for(var q=0;q<cols.length;q++){if(cols[q]<=x.s){j=q;break}}if(j<0){j=cols.length;cols.push(0)}cols[j]=x.e;x.c=j});c.forEach(function(x){x.n=cols.length})});
  var labels='',blocks='';
  for(var r=0;r<=rows;r++)labels+='<span class="hl" style="top:'+(r*H)+'px">'+hlabel(hs+r)+'</span>';
  ev.forEach(function(x){

  });

  return '<div class="tlw">'+(lock?'':'<p class="tl-hint">'+L('tlHint')+'</p>')+'<div class="tl'+(lock?'':' canadd')+'" '+(lock?'':'data-act="tl" ')+'data-hs="'+hs+'" data-h="'+H+'" data-date="'+dk(dt)+'" style="--rows:'+rows+';--hh:'+H+'px">'+labels+blocks+now+'</div></div>';
}

/* ----- stats ----- */
function earliest(){
  var min=null;
  for(var y in S.years){var ts=S.years[y].tasks;for(var id in ts){var t=ts[id];if(t.s==='day'&&(!min||t.k<min))min=t.k}}
  for(var rid in S.core.repeats){var r=S.core.repeats[rid];if(!min||r.st<min)min=r.st}
  return min?pk(min):strip(new Date());
}
var _all=null;function getAll(){if(_all)return _all;_all=computeAll();var t=0;for(var y in S.years){var l=S.years[y].led;if(l)for(var q in l)t+=l[q]}_all.pts=t;return _all}
function computeAll(){
  var today=strip(new Date()),start=earliest(),cap=addDays(today,-1100);if(start<cap)start=cap;
  var mig=!S.core.ledv,migY={};
  var ledAdd=function(key,v,k){var q=yr(k.slice(0,4));if(!q.led[key]){q.led[key]=v;migY[k.slice(0,4)]=1}};
  var o={pts:0,byM:{},byY:{},n:0,d:0,cat:{},run:0,best:0,days:{},dow:[0,1,2,3,4,5,6].map(function(){return {n:0,d:0}})};
  for(var dt=start;dt<=today;dt=addDays(dt,1)){
    var its=dayItems(dt),n=its.length,d=0;
    its.forEach(function(i){
      if(i.done){d++;if(mig)ledAdd(i.ref,(10+(i.p===2?5:i.p===3?10:0))*(S.core.boost[dk(dt)]?2:1),dk(dt))}
      var c=i.g||'none';(o.cat[c]=o.cat[c]||{n:0,d:0});o.cat[c].n++;if(i.done)o.cat[c].d++;
    });
    var mk2=mk(dt),yk=String(dt.getFullYear());
    (o.byM[mk2]=o.byM[mk2]||{n:0,d:0});o.byM[mk2].n+=n;o.byM[mk2].d+=d;
    (o.byY[yk]=o.byY[yk]||{n:0,d:0});o.byY[yk].n+=n;o.byY[yk].d+=d;
    o.days[dk(dt)]={n:n,d:d};
    if(n>0){var w=o.dow[dt.getDay()];w.n+=n;w.d+=d}
    o.n+=n;o.d+=d;
    if(mig&&n>0&&d===n)ledAdd('b:'+dk(dt),20*(S.core.boost[dk(dt)]?2:1),dk(dt));
    if(n>0){if(d===n){o.run++;if(o.run>o.best)o.best=o.run}else if(dt<today&&!S.core.rest[dk(dt)]){o.run=0}}
  }
  if(mig){S.core.ledv=1;mark('core');Object.keys(migY).forEach(function(y){mark('y'+y)})}
  return o;
}

/* ----- chart toolkit (inline SVG, colours come from theme tokens) ----- */
function geo(W,H,pl,pr,pt,pb){
  var ar=lang()==='ar',pw=W-pl-pr;
  return {W:W,H:H,pt:pt,pb:pb,pw:pw,ph:H-pt-pb,ar:ar,
    X:function(t){return ar?(W-pl)-t*pw:pl+t*pw},
    Y:function(v,max){return pt+(H-pt-pb)*(1-v/max)},
    x0:ar?pr:pl,x1:ar?W-pl:W-pr,lx:ar?W-pl+8:pl-8,anc:ar?'start':'end'};
}
function yGrid(g,ticks,max,suffix){
  return ticks.map(function(v){var y=g.Y(v,max);return '<line class="gl" x1="'+g.x0+'" x2="'+g.x1+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'"/><text x="'+g.lx+'" y="'+(y+4).toFixed(1)+'" text-anchor="'+g.anc+'">'+v+(suffix||'')+'</text>'}).join('');
}
function roundTop(x,y,w,h,r){
  if(h<=0.5)return '';
  r=Math.min(r,w/2,h);x=+x.toFixed(1);y=+y.toFixed(1);w=+w.toFixed(1);h=+h.toFixed(1);
  return 'M'+x+' '+(y+h)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+h)+'Z';
}
var svgOpen=function(W,H,label){return '<svg class="cs" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(label)+'">'};
var mshort=function(m){return lang()==='ar'?mname(m):mname(m).slice(0,3)};
var tipAttr=function(a,b,c){return ' data-tip="'+esc(a)+'|'+esc(b||'')+'|'+esc(c||'')+'"'};

/* last 30 days: completion rate as a line + wash */
function lineChart(A){
  var N=30,W=600,H=200,g=geo(W,H,38,12,12,26),today=strip(new Date()),pts=[],i,sum=0,cnt=0;
  for(i=0;i<N;i++){
    var dt=addDays(today,i-(N-1)),r=A.days[dk(dt)]||{n:0,d:0},p=r.n?Math.round(r.d/r.n*100):null;
    if(p!=null){sum+=p;cnt++}
    pts.push({dt:dt,r:r,p:p,x:g.X(i/(N-1)),y:p==null?null:g.Y(p,100)});
  }
  var base=g.Y(0,100).toFixed(1),line='',area='',dots='',run=[];
  function flush(){
    if(run.length>1){
      var pp=run.map(function(q){return q.x.toFixed(1)+' '+q.y.toFixed(1)}).join('L');
      line+='M'+pp;area+='M'+run[0].x.toFixed(1)+' '+base+'L'+pp+'L'+run[run.length-1].x.toFixed(1)+' '+base+'Z';
    }else if(run.length===1)dots+='<circle class="ed" cx="'+run[0].x.toFixed(1)+'" cy="'+run[0].y.toFixed(1)+'" r="4"/>';
    run=[];
  }
  pts.forEach(function(q){if(q.p==null)flush();else run.push(q)});flush();
  var last=null;pts.forEach(function(q){if(q.p!=null)last=q});
  var bw=g.pw/N,hits='';
  pts.forEach(function(q){
    hits+='<g class="pt"><line class="xh" x1="'+q.x.toFixed(1)+'" x2="'+q.x.toFixed(1)+'" y1="'+g.Y(100,100)+'" y2="'+base+'"/><rect class="hit" x="'+(q.x-bw/2).toFixed(1)+'" y="'+g.pt+'" width="'+bw.toFixed(1)+'" height="'+g.ph+'"'+
      tipAttr(q.dt.getDate()+' '+mname(q.dt.getMonth()),q.p==null?'—':q.p+'%',q.p==null?L('st_noTasksDay'):L('ofDone',q.r.d,q.r.n))+'/>'+
      (q.y!=null?'<circle class="hd" cx="'+q.x.toFixed(1)+'" cy="'+q.y.toFixed(1)+'" r="4.5"/>':'')+'</g>';
  });
  var xl='';
  [0,7,14,21,29].forEach(function(i){var q=pts[i],anc=q.x<70?'start':q.x>W-70?'end':'middle';xl+='<text x="'+q.x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="'+anc+'">'+q.dt.getDate()+' '+mname(q.dt.getMonth())+'</text>'});
  var avg=cnt?Math.round(sum/cnt):0;
  var svg=svgOpen(W,H,L('st_30')+', '+L('st_avg',avg))+yGrid(g,[0,50,100],100,'%')+'<path class="ar" d="'+area+'"/><path class="ln" d="'+line+'"/>'+dots+
    (last?'<circle class="ed" cx="'+last.x.toFixed(1)+'" cy="'+last.y.toFixed(1)+'" r="4.5"/>':'')+xl+hits+'</svg>';
  return {svg:svg,avg:avg,has:cnt>0};
}

/* 12 months of one year */
function monthsChart(A,y){
  var W=600,H=190,g=geo(W,H,38,12,12,26),band=g.pw/12,bw=Math.min(22,band*.6),base=g.Y(0,100),now=new Date(),h='',xl='';

    if(p!=null)bar='<path class="'+(cur?'bar-c':'bar-a')+'" d="'+roundTop(cx-bw/2,g.Y(p,100),bw,Math.max(3,base-g.Y(p,100)),4)+'"/>';
    h+='<g class="col" tabindex="0"'+tipAttr(mname(m)+' '+y,p==null?'—':p+'%',v&&v.n?L('ofDone',v.d,v.n):L('st_noTasksDay'))+'><rect class="hit" x="'+(cx-band/2).toFixed(1)+'" y="'+g.pt+'" width="'+band.toFixed(1)+'" height="'+g.ph+'"/>'+bar+'</g>';

/* 20 weeks activity map */
function heatmap(A){
  var WK=20,W=600,gut=34,pitch=(W-gut-2)/WK,cs=pitch-4,top=18,H=top+7*pitch,today=strip(new Date()),todayK=dk(today),ar=lang()==='ar',order=wdOrder();
  var start=addDays(wkStart(today),-(WK-1)*7),cells='',lbl='',lastLbl=-9;
  var colX=function(c){return (ar?(W-gut)-(c+1)*pitch:gut+c*pitch)+(pitch-cs)/2};
  for(var c=0;c<WK;c++){
    var first=addDays(start,c*7);
    if(first.getDate()<=7&&c-lastLbl>=3){lastLbl=c;lbl+='<text class="sm" x="'+(ar?colX(c)+cs:colX(c)).toFixed(1)+'" y="10" text-anchor="'+(ar?'end':'start')+'">'+mname(first.getMonth())+'</text>'}
    for(var r=0;r<7;r++){
      var dt=addDays(start,c*7+r);if(dt>today)continue;
      var k=dk(dt),v=A.days[k]||{n:0,d:0},p=v.n?pctOf(v.d,v.n):null,cls='cell',st='';
      if(p==null)cls+=' c0';else if(p===0)cls+=' cm';else{cls+=' cn';st=' style="fill-opacity:'+(p>=100?1:p>=75?.75:p>=50?.5:.3)+'"'}
      if(k===todayK)cls+=' now';
      cells+='<rect class="'+cls+'" tabindex="0" x="'+colX(c).toFixed(1)+'" y="'+(top+r*pitch+(pitch-cs)/2).toFixed(1)+'" width="'+cs.toFixed(1)+'" height="'+cs.toFixed(1)+'" rx="4"'+st+tipAttr(dname(dt.getDay())+' '+dt.getDate()+' '+mname(dt.getMonth()),p==null?'—':p+'%',v.n?L('ofDone',v.d,v.n):L('st_noTasksDay'))+'/>';
    }
  }
  [0,2,4,6].forEach(function(r){lbl+='<text class="sm" x="'+(ar?W-gut+8:gut-8)+'" y="'+(top+r*pitch+pitch/2+3).toFixed(1)+'" text-anchor="'+(ar?'start':'end')+'">'+dshort(order[r])+'</text>'});
  return svgOpen(W,H,L('st_heat'))+lbl+cells+'</svg>'+
    '<div class="hlg"><span>'+L('st_less')+'</span><i style="opacity:.3"></i><i style="opacity:.5"></i><i style="opacity:.75"></i><i></i><span>'+L('st_more')+'</span></div>';
}

/* categories as a donut + legend */
var CAT_VAR={work:'--c1',study:'--c2',health:'--c3',home:'--c4',money:'--c5',personal:'--c6',none:'--ink2'};
function donutHTML(A){
  var segs=[],tot=0;
  CATS.concat(['none']).forEach(function(c){var v=A.cat[c];if(v&&v.n){segs.push({c:c,n:v.n,d:v.d});tot+=v.n}});
  if(!tot)return '';
  var cum=0,circ='',leg='';
  segs.forEach(function(s){
    var len=s.n/tot*100,vis=Math.max(.6,len-(segs.length>1?1.4:0)),col='var('+CAT_VAR[s.c]+')',nm=L(s.c==='none'?'c_none':'c_'+s.c),pc=Math.round(len);
    circ+='<circle class="seg" tabindex="0" cx="60" cy="60" r="44" pathLength="100" style="stroke:'+col+(s.c==='none'?';stroke-opacity:.45':'')+'" stroke-dasharray="'+vis.toFixed(2)+' '+(100-vis).toFixed(2)+'" stroke-dashoffset="'+(-cum).toFixed(2)+'"'+tipAttr(nm,pc+'%',L('ofDone',s.d,s.n))+'/>';
    cum+=len;
    leg+='<li><span class="sw" style="background:'+col+(s.c==='none'?';opacity:.45':'')+'"></span><span>'+nm+'</span><b>'+s.n+'</b><small>'+pc+'%</small></li>';
  });
  return '<div class="dn"><svg class="cs" viewBox="0 0 120 120" role="img" aria-label="'+esc(L('st_cat'))+'"><g transform="rotate(-90 60 60)">'+circ+'</g><text class="big" x="60" y="64">'+tot+'</text><text class="cap" x="60" y="80">'+L('st_tasksWord')+'</text></svg><ul>'+leg+'</ul></div>';
}

  if(sc==='week'){var s=wkStart(anchor),e=addDays(s,6);return L('hintWeek',s.getDate()+' '+mname(s.getMonth()),e.getDate()+' '+mname(e.getMonth()))}
  if(sc==='month')return L('hintMonth',mname(anchor.getMonth()),anchor.getFullYear());
  if(sc==='year')return L('hintYear',anchor.getFullYear());
  return '';
}
function openTask(o){
  var today=strip(new Date()),anchor=o.date||ui.date;
  if(anchor<today)anchor=today;
  var v={t:'',s:o.scope||'day',date:dk(anchor),end:'',tm:o.tm||'',te:'',n:'',f:'n',dw:[],un:'',p:0,g:''};
  M={edit:false,anchor:anchor,scope:v.s,locked:false,startLock:false,kind:'t'};
  if(o.ref){
    var p=o.ref.split(':');
    if(p[0]==='t'){
      var f=findTask(p[1]);if(!f)return;var t=f.t;
      M.edit=true;M.kind='t';M.id=t.id;M.scope=t.s;M.view=p[2];
      M.locked=lockedScope(t.s,t.s==='day'?p[2]:t.k);
      M.startLock=t.s==='day'&&t.k<TODAY;
      M.anchor=t.s==='day'?pk(t.k):(pk(p[2].length===4?p[2]+'-01-01':p[2].length===7?p[2]+'-01':p[2]));
      v={t:t.t,s:t.s,date:t.s==='day'?t.k:dk(M.anchor),end:t.e||'',tm:t.tm||'',te:t.te||'',n:t.n||'',f:'n',dw:[],un:'',p:t.p||0,g:t.g||''};
    }else{
      var r=S.core.repeats[p[1]];if(!r)return;
      M.edit=true;M.kind='r';M.id=r.id;M.occ=p[2];M.scope='day';M.anchor=pk(p[2]);
      M.locked=p[2]<TODAY;M.startLock=r.st<TODAY;
      v={t:r.t,s:'day',date:r.st,end:'',tm:r.tm||'',te:r.te||'',n:r.n||'',f:r.f,dw:r.dw||[],un:r.un||'',p:r.p||0,g:r.g||''};
    }
  }
  var dis=M.locked?' disabled':'';
  var seg='';
  [['day','sw_day'],['week','sw_week'],['month','sw_month'],['year','sw_year']].forEach(function(s){seg+='<label><input type="radio" name="f-scope" value="'+s[0]+'"'+(v.s===s[0]?' checked':'')+'>'+L(s[1])+'</label>'});
  var dows='';
  wdOrder().forEach(function(d){dows+='<label title="'+dname(d)+'"><input type="checkbox" name="f-dw" value="'+d+'"'+(v.dw.indexOf(d)>=0?' checked':'')+dis+'>'+DS[lang()][d]+'</label>'});
  var reps=['n','d','w','m','y'].map(function(x){return '<option value="'+x+'"'+(v.f===x?' selected':'')+'>'+L('r_'+x)+'</option>'}).join('');
  var prio=[0,1,2,3].map(function(x){return '<label><input type="radio" name="f-p" value="'+x+'"'+(v.p===x?' checked':'')+dis+'>'+L('p'+x)+'</label>'}).join('');
  var cats=['<option value="">'+L('c_none')+'</option>'].concat(CATS.map(function(c){return '<option value="'+c+'"'+(v.g===c?' selected':'')+'>'+L('c_'+c)+'</option>'})).join('');
  var minAttr=M.startLock?'':' min="'+TODAY+'"';
  var title=M.locked?L('viewTask'):M.edit?(M.kind==='r'?L('editRep'):L('editTask')):L('newTask');
  var viewK=M.kind==='r'?M.occ:M.view;
  var canPost=M.edit&&!M.locked&&((M.kind==='t'&&v.s==='day'&&!v.end&&!findTask(M.id).t.d)||(M.kind==='r'&&!isDone(M.id,M.occ)));
  M.viewK=viewK;
  $('#sheet').innerHTML=
   '<form id="tf" novalidate><div style="display:flex;flex-direction:column;gap:14px">'+
   '<div class="sh-h"><h2 id="m-title">'+title+'</h2><button type="button" class="ibtn" data-act="close" aria-label="'+L('close')+'">'+IC.x+'</button></div>'+
   (M.locked?lockBar(M.scope==='day'?L('lockedDay'):L('lockedPeriod')):'')+
   '<label class="fld">'+L('f_title')+'<input type="text" id="f-title" maxlength="140" value="'+esc(v.t)+'" autocomplete="off"'+dis+'></label>'+
   (M.edit?'':'<div class="seg" role="radiogroup" aria-label="'+L('tasks')+'">'+seg+'</div>')+
   '<p class="hint" id="f-hint"></p>'+
   '<div id="f-daybox" style="display:flex;flex-direction:column;gap:14px"><div class="row">'+
     '<label class="fld"><span id="f-date-l">'+L('f_date')+'</span><input type="date" id="f-date" value="'+esc(v.date)+'"'+minAttr+(M.startLock||M.locked?' disabled':'')+'></label>'+
     '<label class="fld" id="f-end-w">'+L('f_endDate')+'<input type="date" id="f-end" value="'+esc(v.end)+'" min="'+esc(v.date>TODAY?v.date:TODAY)+'"'+dis+'></label></div>'+
   '<p class="hint" id="f-end-h">'+L('f_endDateHint')+'</p>'+
   '<div class="row"><label class="fld">'+L('f_from')+'<input type="time" id="f-tm" value="'+esc(v.tm)+'"'+dis+'></label><label class="fld">'+L('f_to')+'<input type="time" id="f-te" value="'+esc(v.te)+'"'+dis+'></label></div>'+
   '<div id="f-repbox" style="display:flex;flex-direction:column;gap:14px"><label class="fld">'+L('f_repeat')+'<select id="f-rep"'+(M.edit&&M.kind==='t'?' disabled':'')+(M.locked?' disabled':'')+'>'+reps+'</select></label>'+
     '<div id="f-weekly"><div class="dows" role="group">'+dows+'</div><p class="hint" style="margin-top:6px">'+L('dowHint')+'</p></div>'+
     '<label class="fld" id="f-until-w">'+L('f_until')+'<input type="date" id="f-until" value="'+esc(v.un)+'"'+dis+'></label></div></div>'+
   '<div class="fld">'+L('f_prio')+'<div class="seg" role="radiogroup">'+prio+'</div></div>'+
   '<label class="fld">'+L('f_cat')+'<select id="f-g"'+dis+'>'+cats+'</select></label>'+
   '<label class="fld">'+L('f_note')+'<textarea id="f-note" rows="2" maxlength="600"'+dis+'>'+esc(v.n)+'</textarea></label>'+
   (canPost?'<div class="fld" id="f-post">'+L('postpone')+'<div class="row" style="align-items:center"><button class="btn sec" type="button" data-act="post" data-n="1">'+(viewK===TODAY?L('po_tom'):L('po_next'))+'</button><button class="btn sec" type="button" data-act="post" data-n="2">'+(viewK===TODAY?L('po_tom2'):L('po_next2'))+'</button></div><div class="row" style="align-items:center;flex-wrap:nowrap"><input type="date" id="f-postd" min="'+TODAY+'" aria-label="'+L('po_pick')+'" style="flex:1"><button class="btn" type="button" data-act="postd">'+L('po_go')+'</button></div></div>':'')+
   '<p class="err" id="f-err" role="alert" hidden></p>'+
   '<div class="acts" id="f-acts">'+(M.locked?'<button class="btn sec" type="button" data-act="close">'+L('close')+'</button>':
      '<button class="btn" type="submit">'+L('save')+'</button><button class="btn sec" type="button" data-act="close">'+L('cancel')+'</button>'+(M.edit?'<span class="sp"></span><button class="btn dng" type="button" data-act="del">'+L('del')+'</button>':''))+'</div>'+
   '</div></form>';
  $('#modal').hidden=false;
  syncModal();
  if(!M.locked)setTimeout(function(){var t=$('#f-title');if(t&&!M.edit)t.focus()},30);
}
function curScope(){if(M.edit)return M.scope;var c=$('input[name="f-scope"]:checked');return c?c.value:'day'}
function syncModal(){
  if(!M)return;
  var sc=curScope(),day=sc==='day',plain=M.edit&&M.kind==='t';
  $('#f-daybox').hidden=!day;
  $('#f-repbox').hidden=!day||plain;
  var f=$('#f-rep').value,rep=!$('#f-repbox').hidden&&f!=='n',showEnd=day&&!rep&&!(M.edit&&M.kind==='r');
  $('#f-end-w').hidden=!showEnd;$('#f-end-h').hidden=!showEnd;
  $('#f-weekly').hidden=!(rep&&f==='w');
  $('#f-until-w').hidden=!rep;
  $('#f-date-l').textContent=rep?L('f_start'):L('f_date');
  var h=$('#f-hint');h.textContent=hintFor(sc,M.anchor);h.hidden=day;
}
function saveModal(){
  if(M.locked)return;
  var title=$('#f-title').value.trim(),err=$('#f-err');
  function bad(m){err.textContent=m;err.hidden=false}
  if(!title)return bad(L('errTitle'));
  var sc=curScope(),tm='',te='',date='',end='',note=$('#f-note').value.trim();
  var pc=$('input[name="f-p"]:checked'),pr=pc?+pc.value:0,g=$('#f-g').value;
  if(sc==='day'){
    date=$('#f-date').value;if(!date)return bad(L('errDate'));
    if(!M.startLock&&date<TODAY)return bad(L('errPast'));
    tm=$('#f-tm').value;te=$('#f-te').value;if(!tm)te='';
    if(tm&&te&&toMin(te)<=toMin(tm))return bad(L('errTime'));
    if(!$('#f-end-w').hidden){end=$('#f-end').value;if(end&&end<date)return bad(L('errEnd'));if(end===date)end=''}
  }else if(!M.edit&&lockedScope(sc,keyFor(sc,M.anchor)))return bad(L('errPeriod'));
  var now=Date.now(),yest=dk(addDays(strip(new Date()),-1));
  if(M.edit&&M.kind==='r'){
    var r=S.core.repeats[M.id];if(!r)return closeModal();
    var f=$('#f-rep').value,un=$('#f-until').value;
    if(f==='n')return bad(L('errRepeat'));
    if(un&&un<date)return bad(L('errUntil'));
    var dw=f==='w'?$$('input[name="f-dw"]:checked').map(function(c){return +c.value}):[];
    if(r.st<TODAY&&un&&un<TODAY)return bad(L('errUntil'));
    M.pend={title:title,tm:tm,te:te,note:note,pr:pr,g:g,f:f,un:un,dw:dw,date:date};
    return askScope();
  }else if(M.edit){
    var fnd=findTask(M.id);if(!fnd)return closeModal();
    var t=fnd.t;t.t=title;t.tm=tm;t.te=te;t.n=note;t.p=pr;t.g=g;
    if(sc==='day'){t.k=date;t.e=end}
    putTask(t);
  }else{
    var rf=sc==='day'?$('#f-rep').value:'n';
    if(sc==='day'&&rf!=='n'){
      var un2=$('#f-until').value;
      if(un2&&un2<date)return bad(L('errUntil'));
      var id=uid();
      S.core.repeats[id]={id:id,t:title,tm:tm,te:te,n:note,f:rf,st:date,un:un2,dw:rf==='w'?$$('input[name="f-dw"]:checked').map(function(c){return +c.value}):[],c:now,p:pr,g:g};
      mark('core');
    }else{
      var nt={id:uid(),t:title,s:sc,k:sc==='day'?date:keyFor(sc,M.anchor),tm:tm,te:te,d:0,n:note,c:now,p:pr,g:g};
      if(end)nt.e=end;
      putTask(nt);
    }
  }
  closeModal();render();
}
/* ---------- repeating tasks: choose the scope of an edit or delete ---------- */
function occDates(from,to){
  var r=S.core.repeats[M.id],out=[],n=0;
  if(!r)return out;
  for(var d=pk(from),e=pk(to);d<=e&&n<400;d=addDays(d,1),n++){var k=dk(d);if(k>=TODAY&&repMatch(r,d)&&!isSkip(M.id,k))out.push(k)}
  return out;
}
function askScope(){
  var box=$('#f-acts');M.actsHTML=box.innerHTML;
  var d=pk(M.occ);
  box.innerHTML='<span class="hint" style="width:100%">'+L('sc_ask')+'</span>'+
    '<button class="btn" type="button" data-act="sc-one">'+L('sc_one')+' ('+d.getDate()+' '+mname(d.getMonth())+')</button>'+
    '<button class="btn sec" type="button" data-act="sc-days">'+L('sc_days')+'</button>'+
    '<button class="btn sec" type="button" data-act="sc-all">'+L('sc_all')+'</button>'+
    '<span class="hint" style="width:100%">'+L('sc_allNote')+'</span>'+
    '<button class="btn sec" type="button" data-act="sc-back">'+L('sc_back')+'</button>';
}
function rangeUI(goAct,label){
  var box=$('#f-acts');M.chooserHTML=box.innerHTML;
  box.innerHTML='<div class="row" style="width:100%"><label class="fld">'+L('sc_from')+'<input type="date" id="sc-from" min="'+TODAY+'" value="'+esc(M.occ)+'"></label><label class="fld">'+L('sc_to')+'<input type="date" id="sc-to" min="'+TODAY+'" value="'+esc(M.occ)+'"></label></div>'+
    '<p class="err" id="sc-msg" role="alert" hidden></p>'+
    '<button class="btn" type="button" data-act="'+goAct+'">'+label+'</button><button class="btn sec" type="button" data-act="sc-back2">'+L('sc_back')+'</button>';
}
function scMsg(m){var e=$('#sc-msg');if(e){e.textContent=m;e.hidden=false}}
function scopeBack(){var box=$('#f-acts');if(box&&M&&M.actsHTML)box.innerHTML=M.actsHTML}
function applyAll(){
  var q=M.pend,r=S.core.repeats[M.id];if(!r)return closeModal();
  var yest=dk(addDays(strip(new Date()),-1));
  if(r.st<TODAY){
    /* keep history: end the old series yesterday, start a new one today */
    var np={id:uid(),t:q.title,tm:q.tm,te:q.te,n:q.note,f:q.f,st:TODAY,un:q.un&&q.un>=TODAY?q.un:'',dw:q.dw,c:r.c,p:q.pr,g:q.g};
    r.un=r.un&&r.un<yest?r.un:yest;
    for(var y in S.years){var o=S.years[y],ch=false;
      ['rdone','rskip'].forEach(function(m){Object.keys(o[m]).forEach(function(key){
        if(key.indexOf(M.id+'|')===0&&key.slice(M.id.length+1)>=TODAY){o[m][np.id+'|'+key.slice(M.id.length+1)]=o[m][key];delete o[m][key];ch=true}})});
      if(ch)mark('y'+y)}
    S.core.repeats[np.id]=np;
  }else{r.t=q.title;r.tm=q.tm;r.te=q.te;r.n=q.note;r.f=q.f;r.st=q.date;r.un=q.un;r.dw=q.dw;r.p=q.pr;r.g=q.g}
  mark('core');closeModal();render();
}
function applyOccurrences(dates){
  var q=M.pend,now=Date.now();
  dates.forEach(function(k,i){
    var y=k.slice(0,4),o=yr(y),was=!!o.rdone[rKey(M.id,k)];
    o.rskip[rKey(M.id,k)]=1;
    putTask({id:uid(),t:q.title,s:'day',k:k,tm:q.tm,te:q.te,d:was?1:0,n:q.note,c:now+i,p:q.pr,g:q.g});
    mark('y'+y);
  });
  closeModal();render();toast(L('sc_done',dates.length));
}
function deleteOccurrences(dates){
  dates.forEach(function(k){var y=k.slice(0,4);yr(y).rskip[rKey(M.id,k)]=1;mark('y'+y)});
  closeModal();render();toast(L('sc_deld',dates.length));
}
function rangeDates(){
  var f=$('#sc-from').value,t=$('#sc-to').value;
  if(!f||!t||f<TODAY||t<f){scMsg(L('sc_rangeErr'));return null}
  var ds=occDates(f,t);if(!ds.length){scMsg(L('sc_none'));return null}
  return ds;
}
function askDelete(){
  var box=$('#f-acts'),yest=dk(addDays(strip(new Date()),-1));
  if(M.kind==='r'){
    var r=S.core.repeats[M.id];
    M.actsHTML=box.innerHTML;box.innerHTML='<span class="hint" style="width:100%">'+L('delRepAsk')+'</span><button class="btn dng" type="button" data-act="del-one">'+L('delOne')+'</button><button class="btn dng" type="button" data-act="del-days">'+L('sc_days')+'</button><button class="btn dng" type="button" data-act="del-all">'+(r&&r.st<TODAY?L('delStopRep'):L('delAllRep'))+'</button><button class="btn sec" type="button" data-act="sc-back">'+L('delBack')+'</button>';
  }else{
    var t=findTask(M.id).t;
    if(isRange(t)&&t.k<TODAY)box.innerHTML='<span class="hint" style="width:100%">'+L('delRangeAsk')+'</span><button class="btn dng" type="button" data-act="del-stop">'+L('delStopRange')+'</button><button class="btn dng" type="button" data-act="del-all">'+L('delAllRange')+'</button><button class="btn sec" type="button" data-act="close">'+L('delBack')+'</button>';
    else box.innerHTML='<span class="hint" style="width:100%">'+L('delAsk')+'</span><button class="btn dng" type="button" data-act="del-all">'+L('delYes')+'</button><button class="btn sec" type="button" data-act="close">'+L('delBack')+'</button>';
  }
}
function doDelete(mode){
  var yest=dk(addDays(strip(new Date()),-1));
  if(M.kind==='r'){
    var r=S.core.repeats[M.id];
    if(mode==='all'){if(r&&r.st<TODAY){r.un=r.un&&r.un<yest?r.un:yest}else delete S.core.repeats[M.id];mark('core')}
    else{var y=M.occ.slice(0,4);yr(y).rskip[rKey(M.id,M.occ)]=1;mark('y'+y)}
  }else{
    var f=findTask(M.id);
    if(f){
      if(mode==='stop'){f.t.e=yest>f.t.k?yest:'';mark('y'+f.y)}
      else{delete S.years[f.y].tasks[M.id];mark('y'+f.y)}
    }
  }
  closeModal();render();
}
function doPostpone(target){
  var err=$('#f-err');
  function bad(m){if(err){err.textContent=m;err.hidden=false}}
  if(!target)return bad(L('errDate'));
  if(target<TODAY)return bad(L('po_past'));
  if(target===M.viewK)return bad(L('po_same'));
  if(M.kind==='r'){
    var r=S.core.repeats[M.id];if(!r)return closeModal();
    var y=M.occ.slice(0,4);yr(y).rskip[rKey(M.id,M.occ)]=1;mark('y'+y);
    putTask({id:uid(),t:r.t,s:'day',k:target,tm:r.tm||'',te:r.te||'',d:0,n:r.n||'',c:Date.now(),p:r.p||0,g:r.g||''});
  }else{
    var f=findTask(M.id);if(!f)return closeModal();
    f.t.k=target;putTask(f.t);
  }
  var d=pk(target);
  closeModal();render();toast(L('postponed',dname(d.getDay())+' '+d.getDate()+' '+mname(d.getMonth())));
}
function moveTomorrow(){
  var f=findTask(M.id);if(!f)return;
  var t=f.t;t.k=dk(addDays(strip(new Date()),1));putTask(t);closeModal();render();toast(L('moved'));
}

/* ---------- search ---------- */
function openSearch(){
  M={search:true};
  $('#sheet').innerHTML='<div class="sh-h"><h2 id="m-title">'+L('search')+'</h2><button type="button" class="ibtn" data-act="close" aria-label="'+L('close')+'">'+IC.x+'</button></div>'+
    '<input class="inp" type="search" id="s-q" placeholder="'+L('searchPh')+'" autocomplete="off" aria-label="'+L('search')+'"><div id="s-res"><p class="note">'+L('searchHint')+'</p></div>';
  $('#modal').hidden=false;setTimeout(function(){var q=$('#s-q');if(q)q.focus()},30);
}
function doSearch(q){
  q=q.trim().toLowerCase();var box=$('#s-res');if(!box)return;
  if(!q){box.innerHTML='<p class="note">'+L('searchHint')+'</p>';return}
  var out=[];
  function hit(t){return (t.t||'').toLowerCase().indexOf(q)>=0||(t.n||'').toLowerCase().indexOf(q)>=0}
  for(var y in S.years){var ts=S.years[y].tasks;for(var id in ts){var t=ts[id];if(hit(t))out.push({t:t.t,s:t.s,k:t.k,sort:t.k})}}
  for(var rid in S.core.repeats){var r=S.core.repeats[rid];if(hit(r))out.push({t:r.t,s:'rep',k:r.st>TODAY?r.st:(r.un&&r.un<TODAY?r.un:TODAY),sort:r.st,rep:true})}
  out.sort(function(a,b){return a.sort<b.sort?1:-1});out=out.slice(0,40);
  if(!out.length){box.innerHTML='<p class="note">'+L('searchNone')+'</p>';return}
  box.innerHTML=out.map(function(x){
    var when;
    if(x.s==='day'||x.s==='rep'){var d=pk(x.k);when=d.getDate()+' '+mname(d.getMonth())+' '+d.getFullYear()+(x.rep?' · '+L('repeatTip'):'')}
    else if(x.s==='week'){var w=pk(x.k);when=L('sw_week')+' · '+w.getDate()+' '+mname(w.getMonth())}
    else if(x.s==='month'){var a=x.k.split('-');when=L('sw_month')+' · '+mname(+a[1]-1)+' '+a[0]}
    else when=L('sw_year')+' · '+x.k;
    return '<button type="button" class="sr" data-act="sgo" data-s="'+x.s+'" data-k="'+esc(x.k)+'"><span>'+esc(x.t)+'</span><small>'+when+'</small></button>';
  }).join('');
}
function searchGo(s,k){
  closeModal();
  if(s==='day'||s==='rep'){ui.filter='all';goTo('home',pk(k))}
  else if(s==='week'){ui.cal='week';goTo('cal',pk(k))}
  else if(s==='month'){var a=k.split('-');ui.cal='month';goTo('cal',new Date(+a[0],+a[1]-1,1))}
  else{ui.cal='year';goTo('cal',new Date(+k,0,1))}
}

/* ---------- backup ---------- */
function say(m){var el=$('#s-msg');if(el)el.textContent=m}
async function exportBackup(){
  try{
    var dl=await window.claude.use('downloads');
    if(!dl){say(L('s_exNo'));return}
    await dl.save({filename:'ayami-backup-'+TODAY+'.json',data:JSON.stringify(S)});
    say(L('s_exOk'));
  }catch(e){say(e&&e.code==='declined'?L('s_exCancel'):L('s_exFail'))}
}
function importBackup(file){
  if(!file)return;
  var fr=new FileReader();
  fr.onload=function(){
    try{
      var imp=JSON.parse(String(fr.result));
      if(!imp||typeof imp!=='object'||!imp.years||!imp.core)throw new Error('bad');
      var n=0,id,y;
      for(y in imp.years){var o=imp.years[y],T=yr(y);
        for(id in (o.tasks||{})){T.tasks[id]=o.tasks[id];n++}

      for(id in (imp.core.repeats||{})){S.core.repeats[id]=imp.core.repeats[id];n++}
      if(!S.core.profile&&imp.core.profile)S.core.profile=imp.core.profile;
      mark('core');render();say(L('s_imOk',n));
    }catch(e){say(L('s_imBad'))}
  };

/* ---------- android notifications (Capacitor local notifications) ---------- */
var LN=null,NATIVE=false;
try{
  var CAP=window.Capacitor;
  NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
  if(NATIVE){LN=(CAP.Plugins&&CAP.Plugins.LocalNotifications)||(CAP.registerPlugin&&CAP.registerPlugin('LocalNotifications'))||null;if(!LN)NATIVE=false}
}catch(e){NATIVE=false}
var nErr='';
var nTimer=null;
function notifSoon(){if(!NATIVE)return;clearTimeout(nTimer);nTimer=setTimeout(reschedule,1500)}
async function reschedule(){
  if(!NATIVE)return;
  try{
    var perm=await LN.checkPermissions();if(perm.display!=='granted')return;
    var pend=await LN.getPending();
    if(pend.notifications&&pend.notifications.length)await LN.cancel({notifications:pend.notifications.map(function(n){return {id:n.id}})});
    buildIdx();
    var al=S.core.settings.al,now=Date.now(),today=strip(new Date()),out=[];
    for(var i=0;i<30;i++){
      var dt=addDays(today,i);
      dayItems(dt).forEach(function(it){
        if(!it.tm||it.done)return;
        var at=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),0,toMin(it.tm)-al);
        if(at.getTime()<=now+5000)return;
        out.push({title:it.title,body:al?L('n_in',al,tfmt(it.tm)):L('n_now',tfmt(it.tm)),at:at,ref:it.ref});
      });
    }
    out.sort(function(a,b){return a.at-b.at});
    out=out.slice(0,300).map(function(x,j){return {id:j+1,title:x.title,body:x.body,channelId:'tasks',schedule:{at:x.at,allowWhileIdle:true},extra:{ref:x.ref}}});
    if(out.length)await LN.schedule({notifications:out});
    nErr='';
  }catch(e){nErr=String(e&&e.message||e)}
}
async function nativeTest(){
  var m=$('#s-msg2');
  try{
    var p=await LN.checkPermissions();
    if(p.display!=='granted'){p=await LN.requestPermissions();if(p.display!=='granted'){if(m)m.textContent=L('n_testDenied');return}}
    await LN.schedule({notifications:[{id:999999,title:L('appName'),body:L('n_testBody'),channelId:'tasks',schedule:{at:new Date(Date.now()+10000),allowWhileIdle:true}}]});
    if(m)m.textContent=L('n_testSent');
  }catch(e){if(m)m.textContent=L('n_testFail')+' '+String(e&&e.message||e)}
}
async function nativeAsk(){try{await LN.requestPermissions()}catch(e){}await reschedule();nativeStatus()}
async function nativeStatus(){
  var box=$('#s-native');if(!box||!NATIVE)return;
  try{
    var p=await LN.checkPermissions(),h='';
    if(p.display!=='granted')h+='<p class="err">'+L('s_notifOff')+'</p><div class="acts"><button class="btn" type="button" data-act="n-perm">'+L('s_notifEnable')+'</button></div>';
    else{
      try{var ex=await LN.checkExactNotificationSetting();
        if(ex&&ex.exact_alarm&&ex.exact_alarm!=='granted')h+='<p class="note">'+L('s_exactNote')+'</p><div class="acts"><button class="btn sec" type="button" data-act="n-exact">'+L('s_exactBtn')+'</button></div>';
        else h+='<p class="note">'+L('s_notifOn')+'</p>';
      }catch(e){h+='<p class="note">'+L('s_notifOn')+'</p>'}
      var pn=0;try{var pd=await LN.getPending();pn=(pd.notifications||[]).length}catch(e){}
      h+='<p class="note">'+L('n_pending',pn)+'</p>'+(nErr?'<p class="err">'+esc(nErr)+'</p>':'')+'<div class="acts"><button class="btn sec" type="button" data-act="n-test">'+L('n_test')+'</button></div><p class="note" id="s-msg2" role="status"></p>';
    }
    var cur=$('#s-native');if(cur)cur.innerHTML=h;
  }catch(e){}
}
async function initNative(){
  if(!NATIVE)return;
  try{
    await LN.createChannel({id:'tasks',name:L('n_channel'),description:L('n_channelD'),importance:5,visibility:1,vibration:true});
    var p=await LN.checkPermissions();
    if(p.display!=='granted')await LN.requestPermissions();
  }catch(e){}
  reschedule();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')reschedule()});
}

/* ---------- chart tooltip (one shared element, text only) ---------- */
(function(){
  var tip=document.getElementById('tip'),cur=null;
  function fill(el){
    var s=(el.getAttribute('data-tip')||'').split('|');
    tip.textContent='';
    var a=document.createElement('span');a.textContent=s[0]||'';
    var b=document.createElement('b');b.textContent=s[1]||'';
    var c=document.createElement('span');c.textContent=s[2]||'';
    tip.appendChild(a);tip.appendChild(b);if(s[2])tip.appendChild(c);
  }
  function place(x,y){
    var w=tip.offsetWidth,h=tip.offsetHeight;
    var left=Math.min(Math.max(8,x-w/2),window.innerWidth-w-8),top=y-h-16;
    if(top<8)top=y+20;
    tip.style.left=left+'px';tip.style.top=top+'px';
  }
  function show(el,x,y){if(cur!==el){cur=el;fill(el)}tip.hidden=false;place(x,y)}
  function hide(){cur=null;tip.hidden=true}
  document.addEventListener('pointerover',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)show(el,e.clientX,e.clientY)});
  document.addEventListener('pointermove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)show(el,e.clientX,e.clientY);else if(cur)hide()});
  document.addEventListener('pointerdown',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el)show(el,e.clientX,e.clientY);else hide()});
  document.addEventListener('focusin',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');if(el){var r=el.getBoundingClientRect();show(el,r.left+r.width/2,r.top)}});
  document.addEventListener('focusout',hide);
  window.addEventListener('scroll',hide,{passive:true});
  document.addEventListener('click',function(e){if(!(e.target.closest&&e.target.closest('[data-tip]')))hide()});
})();

  var wait=Math.max(0,1900-(Date.now()-t0));

  applyLang();applyTheme();
  if(S.core.profile&&S.core.profile.ar&&S.core.profile.en)enter();else showOnboarding();
  var sp=$('#splash');sp.classList.add('out');setTimeout(function(){sp.hidden=true;sp.style.display='none'},600);
}
boot();
